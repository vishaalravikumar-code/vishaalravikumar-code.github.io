<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audio Crest · Payments Tracker</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css?v=b29a9c7b">
</head>
<body class="locked">
<style>
body.locked .shell{display:none}
.gate{display:grid;place-items:center;min-height:100vh;padding:20px}
.gate .box{width:min(380px,100%)}.gate .brandbar{margin-bottom:18px}
.gate h1{font-size:20px;text-align:center;margin-bottom:4px}.gate p{text-align:center;color:var(--mute);margin:0 0 14px}
.gate .err{color:var(--bad);min-height:20px;margin:8px 0 0;text-align:center;font-size:13px}
</style>
<div class="gate" id="gate"><form class="card box" id="gf">
<div class="brandbar"><img src="logo.png?v=b29a9c7b" alt="Audio Crest Chennai"></div>
<h1>Sign in</h1><p>Enter the password to continue</p>
<input id="gp" type="password" placeholder="Password" autocomplete="current-password" autofocus required>
<button class="btn primary" style="width:100%;margin-top:14px;padding:10px">Continue</button><div class="err" id="ge"></div></form></div>
<div class="shell">
  <aside class="side">
    <div class="brandbar"><img src="logo.png?v=b29a9c7b" alt="Audio Crest Chennai"></div>
    <button class="menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false">☰ Menu</button>
    <nav id="nav">
      <button data-view="dashboard"><i>▦</i>Dashboard</button>
      <button data-view="pipeline"><i>◫</i>Pipeline</button>
      <button data-view="clients"><i>☺</i>Clients</button>
      <button data-view="payments"><i>₹</i>Payments</button>
      <button data-view="stock"><i>▤</i>Stock</button>
      <button data-view="catalog"><i>♪</i>Catalog</button>
      <button data-view="emails"><i>✉</i>Emails</button>
    </nav>
    <div class="side-foot">Chennai · Hi-fi &amp; installation<br><a href="#" id="logout" hidden style="color:var(--mute)">Sign out</a></div>
  </aside>
  <div class="content">
    <header class="top"><div><h1 id="title">Dashboard</h1><p id="sub"></p></div>
      <button class="btn primary" data-act="new-client">+ New client</button></header>
    <main id="main"></main>
  </div>
</div>
<aside id="drawer" class="drawer" hidden></aside>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" hidden></div>
<script type="module">
const HASH = '5994471abb01112afcc18159f6cc74b4f511b99806da59b3caf5a9c173cacfc5';
const sha = async s => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))].map(b => b.toString(16).padStart(2, '0')).join('');
const start = async () => {
  document.body.classList.remove('locked'); document.getElementById('gate')?.remove();
  try { await (await import('./static-app.js?v=b29a9c7b')).boot(); } catch (e) { document.body.insertAdjacentHTML('afterbegin', '<pre style="padding:20px;color:#c4302b">Could not start: ' + e.message + '</pre>'); console.error(e); }
};
let ok = false; try { ok = sessionStorage.getItem('ac_ok') === '1'; } catch {}
if (ok) start(); else document.getElementById('gf').onsubmit = async e => {
  e.preventDefault();
  if (await sha(document.getElementById('gp').value) === HASH) { try { sessionStorage.setItem('ac_ok', '1'); } catch {} start(); }
  else { document.getElementById('ge').textContent = 'Wrong password'; document.getElementById('gp').select(); }
};
</script>
</body>
</html>
